<main class="auth-page">
  <section class="auth-card">
    <div class="brand-panel">
      <img class="brand-logo" src="../../assets/logo-t-1.png" alt="VABIRA">
      <div>
        <p class="eyebrow">Panel de gestión</p>
        <h1>Administrá turnos, clientes y ventas desde un solo lugar.</h1>
      </div>
    </div>

    <div class="form-panel">
      <header>
        <p class="eyebrow">Acceso</p>
        <h2>Iniciar sesión</h2>
      </header>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" [(ngModel)]="username" pInputText autocomplete="username" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" pInputText autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" pPassword autocomplete="current-password" required>
        </div>
        <button pButton type="submit" label="Iniciar sesión"></button>
      </form>

      <nav class="auth-links" aria-label="Acciones de cuenta">
        <a routerLink="/register">Crear cuenta</a>
        <a routerLink="/forgot-password">Recuperar contraseña</a>
      </nav>
    </div>
  </section>

  <p-messages class="custom-messages"></p-messages>
</main>
