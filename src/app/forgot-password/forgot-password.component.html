<main class="recovery-page">
  <section class="recovery-panel">
    <img class="brand-mark" src="../../assets/logo-t-1.png" alt="Vabira">

    <header class="recovery-header">
      <p class="eyebrow">Acceso seguro</p>
      <h1>{{ changePasswordFormVisible ? "Nueva contraseña" : "Recuperar contraseña" }}</h1>
    </header>

    <ol class="step-list" aria-label="Progreso de recuperación">
      <li [class.active]="!changePasswordFormVisible">Email</li>
      <li [class.active]="requestCode && !changePasswordFormVisible">Código</li>
      <li [class.active]="changePasswordFormVisible">Contraseña</li>
    </ol>

    <form
      *ngIf="!changePasswordFormVisible"
      [formGroup]="emailForm"
      class="recovery-form"
      (ngSubmit)="onRequestCode()"
    >
      <label for="email">Email</label>
      <input
        pInputText
        type="email"
        id="email"
        autocomplete="email"
        placeholder="tu@email.com"
        formControlName="email"
      />

      <div class="actions">
        <p-button
          icon="pi pi-send"
          label="Enviar código"
          type="submit"
          [disabled]="emailForm.invalid"
        ></p-button>
        <p-button
          icon="pi pi-arrow-left"
          label="Cancelar"
          styleClass="p-button-text"
          type="button"
          routerLink="/login"
        ></p-button>
      </div>
    </form>

    <form
      *ngIf="!changePasswordFormVisible"
      [formGroup]="codeForm"
      class="recovery-form code-form"
      (ngSubmit)="onVerifyCode()"
    >
      <label for="code">Código</label>
      <div class="inline-control">
        <input
          pInputText
          type="text"
          inputmode="numeric"
          maxlength="6"
          id="code"
          autocomplete="one-time-code"
          placeholder="000000"
          formControlName="code"
        />
        <p-button
          icon="pi pi-check"
          label="Verificar"
          type="submit"
          [disabled]="!verifyButtonEnabled || codeForm.invalid"
        ></p-button>
      </div>
    </form>

    <form
      *ngIf="changePasswordFormVisible"
      [formGroup]="changePasswordForm"
      (ngSubmit)="onSubmit()"
      class="recovery-form"
    >
      <label for="password">Nueva contraseña</label>
      <input
        pInputText
        type="password"
        id="password"
        autocomplete="new-password"
        formControlName="password"
      />

      <label for="repeatPassword">Repetir contraseña</label>
      <input
        pInputText
        type="password"
        id="repeatPassword"
        autocomplete="new-password"
        formControlName="repeatPassword"
      />

      <div class="actions">
        <p-button
          icon="pi pi-key"
          label="Cambiar contraseña"
          type="submit"
          [disabled]="changePasswordForm.invalid"
        ></p-button>
        <p-button
          icon="pi pi-arrow-left"
          label="Cancelar"
          styleClass="p-button-text"
          type="button"
          (click)="onCancel()"
        ></p-button>
      </div>
    </form>
  </section>
</main>
